version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kiarie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/payment_saas
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_SECRET: ${ADMIN_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      PAYMENT_RATE_LIMIT: ${PAYMENT_RATE_LIMIT:-10}
      DISBURSEMENT_RATE_LIMIT: ${DISBURSEMENT_RATE_LIMIT:-5}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      GENERAL_API_RATE_LIMIT: ${GENERAL_API_RATE_LIMIT:-60}
      ADMIN_RATE_LIMIT: ${ADMIN_RATE_LIMIT:-20}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
